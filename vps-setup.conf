################################################################################
# VPS Setup Configuration File
#
# This file controls which features and configurations will be applied
# during the VPS setup process.
#
# Format:
#   - Lines starting with # are comments
#   - Section headers are in [SECTION_NAME] format
#   - Options are key=value pairs
#   - Boolean values: true/false, yes/no, 1/0
#   - Empty values or commented options use script defaults
#
################################################################################

[GENERAL]
# Main user to create (if empty, will prompt during setup)
MAIN_USER=debian

# SSH public key (paste your full key here, or leave empty to prompt)
SSH_PUBLIC_KEY=

# Timezone configuration (e.g., Europe/Madrid, America/New_York, UTC)
TIMEZONE=Europe/Madrid

# Locales to generate (space-separated)
LOCALES=es_ES.UTF-8 en_US.UTF-8

# Default locale
DEFAULT_LOCALE=en_US.UTF-8

# Hostname (leave empty to keep current)
HOSTNAME=

################################################################################

[SSH]
# Enable SSH configuration
ENABLE=true

# SSH port to use
PORT=1022

# Disable root login
DISABLE_ROOT_LOGIN=true

# Disable password authentication
DISABLE_PASSWORD_AUTH=true

# Enable public key authentication
ENABLE_PUBKEY_AUTH=true

# Maximum authentication tries
MAX_AUTH_TRIES=3

# Client alive interval (seconds)
CLIENT_ALIVE_INTERVAL=300

# Client alive count max
CLIENT_ALIVE_COUNT_MAX=2

# Enable verbose logging
VERBOSE_LOGGING=true

# Enable 2FA with Google Authenticator
ENABLE_2FA=false

################################################################################

[SECURITY]
# Enable UFW firewall
ENABLE_FIREWALL=true

# Enable Fail2ban
ENABLE_FAIL2BAN=true

# Fail2ban ban time (seconds)
FAIL2BAN_BANTIME=7200

# Fail2ban max retry
FAIL2BAN_MAXRETRY=3

# Enable automatic security updates
ENABLE_AUTO_UPDATES=true

# Enable AppArmor
ENABLE_APPARMOR=true

# Enable Auditd (system auditing)
ENABLE_AUDITD=true

# Enable rootkit detection (rkhunter)
ENABLE_RKHUNTER=true

# Enable ClamAV antivirus
ENABLE_CLAMAV=false

# Enable AIDE (intrusion detection)
ENABLE_AIDE=false

# Enable Logwatch (daily log reports)
ENABLE_LOGWATCH=true

# Email for security alerts (leave empty to disable email alerts)
ALERT_EMAIL=

# Disable IPv6
DISABLE_IPV6=true

# Enable kernel hardening
ENABLE_KERNEL_HARDENING=true

# Secure /tmp with noexec
SECURE_TMP=true

# Disable core dumps
DISABLE_CORE_DUMPS=true

################################################################################

[SYSTEM]
# Update system during setup
UPDATE_SYSTEM=true

# Install essential packages
INSTALL_ESSENTIALS=true

# Disable unnecessary services
DISABLE_UNNECESSARY_SERVICES=true

# Apply system optimizations
APPLY_OPTIMIZATIONS=true

# Configure swap (if doesn't exist, size in MB, 0 to disable)
SWAP_SIZE=2048

# Configure systemd journal size limit (MB, 0 for default)
JOURNAL_SIZE_LIMIT=500

# Enable etckeeper (version control for /etc)
ENABLE_ETCKEEPER=true

################################################################################

[SHELL]
# Configure custom bash prompts
CONFIGURE_PROMPTS=true

# Install and configure zsh
INSTALL_ZSH=false

# Install oh-my-zsh (requires zsh)
INSTALL_OH_MY_ZSH=false

# Install starship prompt
INSTALL_STARSHIP=false

# Install fzf (fuzzy finder)
INSTALL_FZF=true

# Install useful shell aliases
INSTALL_ALIASES=true

################################################################################

[MONITORING]
# Enable Netdata (real-time monitoring)
ENABLE_NETDATA=false

# Enable Prometheus Node Exporter
ENABLE_NODE_EXPORTER=false

# Enable Monit (service monitoring and auto-recovery)
ENABLE_MONIT=false

# Enable sysstat (sar, iostat, mpstat)
ENABLE_SYSSTAT=true

# Monit check interval (seconds)
MONIT_INTERVAL=120

################################################################################

[BACKUP]
# Enable backup configuration
ENABLE_BACKUP=true

# Install Restic backup tool
INSTALL_RESTIC=true

# Install Borg backup tool
INSTALL_BORG=false

# Backup destination (local path, s3://bucket, sftp://user@host/path)
BACKUP_DESTINATION=/var/backups

# Backup schedule (cron format, empty to skip)
BACKUP_SCHEDULE=0 2 * * *

# Backup retention (days)
BACKUP_RETENTION=30

################################################################################

[NETWORK]
# Install Tailscale
INSTALL_TAILSCALE=true

# Enable Tailscale as exit node
TAILSCALE_EXIT_NODE=true

# Install WireGuard
INSTALL_WIREGUARD=false

# Install cloudflared (DNS-over-HTTPS)
INSTALL_CLOUDFLARED=false

# Network diagnostic tools (mtr, iperf3, nmap)
INSTALL_NET_TOOLS=true

################################################################################

[DEVELOPMENT]
# Install Python development tools
INSTALL_PYTHON=true

# Install Go
INSTALL_GO=true

# Install Node.js
INSTALL_NODEJS=true

# Node.js version (lts, current, or specific like 20)
NODEJS_VERSION=lts

# Install Rust
INSTALL_RUST=false

# Install Docker
INSTALL_DOCKER=false

# Install Docker Compose
INSTALL_DOCKER_COMPOSE=false

# Add main user to docker group
DOCKER_USER_ACCESS=true

# Install Podman (alternative to Docker)
INSTALL_PODMAN=false

# Install direnv
INSTALL_DIRENV=true

################################################################################

[WEBSERVER]
# Install Nginx
INSTALL_NGINX=false

# Install Caddy
INSTALL_CADDY=false

# Install Certbot (Let's Encrypt)
INSTALL_CERTBOT=false

# Auto-configure SSL
AUTO_SSL=false

################################################################################

[DATABASE]
# Install PostgreSQL
INSTALL_POSTGRESQL=false

# PostgreSQL version (leave empty for default)
POSTGRESQL_VERSION=

# Install MariaDB
INSTALL_MARIADB=false

# Install Redis
INSTALL_REDIS=false

# Redis as cache only (no persistence)
REDIS_CACHE_ONLY=true

################################################################################

[MAIL]
# Configure mail sending (for alerts)
ENABLE_MAIL=false

# Mail transfer agent (postfix, msmtp)
MAIL_AGENT=msmtp

# SMTP server
SMTP_SERVER=

# SMTP port
SMTP_PORT=587

# SMTP user
SMTP_USER=

# SMTP password
SMTP_PASSWORD=

# From email address
MAIL_FROM=

################################################################################

[TOOLS]
# Install Midnight Commander
INSTALL_MC=true

# Install vim
INSTALL_VIM=true

# Install tmux
INSTALL_TMUX=true

# Install screen
INSTALL_SCREEN=true

# Install htop
INSTALL_HTOP=true

# Install modern CLI tools (ripgrep, fd, bat, etc.)
INSTALL_MODERN_TOOLS=true

# Install Git
INSTALL_GIT=true

################################################################################

[MAINTENANCE]
# Create maintenance scripts
CREATE_SCRIPTS=true

# Create system update script
CREATE_UPDATE_SCRIPT=true

# Create disk usage script
CREATE_DISKUSAGE_SCRIPT=true

# Create system info script
CREATE_SYSINFO_SCRIPT=true

# Create backup script
CREATE_BACKUP_SCRIPT=true

# Create health check script
CREATE_HEALTHCHECK_SCRIPT=true

# Create log analyzer script
CREATE_LOGANALYZER_SCRIPT=false

# Create benchmark script
CREATE_BENCHMARK_SCRIPT=true

################################################################################

[ADVANCED]
# Verbose output during setup
VERBOSE=true

# Create detailed log file
CREATE_LOG=true

# Log file path
LOG_FILE=/var/log/vps-setup.log

# Dry run mode (show what would be done, don't execute)
DRY_RUN=false

# Skip confirmation prompts (use with caution!)
SKIP_PROMPTS=false

# Enable experimental features
ENABLE_EXPERIMENTAL=false
